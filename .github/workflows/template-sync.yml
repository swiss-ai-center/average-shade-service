name: template-sync.yml
on:
# Cronjob trigger (runs every Sunday at midnight)
  schedule:
  - cron: "0 0 * * 0"
  # Manual trigger
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    # Grant necessary permissions to create pull requests
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checkout the current repository
      - name: Checkout
        uses: actions/checkout@v4
      # Run the template sync action
      - name: actions-template-sync
        uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: swiss-ai-center/create-a-new-service-generic-template
          upstream_branch: main
          pr_labels: template-sync, automated-pr